[project]
name = "chromr"
version = "0.2.0"
type = "package"
title = "Read and Plot FPLC Chromatograms"
description = '''
For reading files from BioRad QuadTec machines and making
plots of the charomatograms.'''
license = "MIT + file LICENSE"

[[project.authors]]
name = "Brady Johnston"
email = "brady.johnston@me.com"
roles = ["cre"]

[project.urls]
bugreports = "https://github.com/BradyAJohnston/chromr/issues"
homepage = "https://github.com/BradyAJohnston/chromr"

[dependencies]
R = ">= 4.1.0"
dplyr = "*"
ggplot2 = ">= 3.4.0"
glue = "*"
janitor = "*"
lifecycle = "*"
purrr = "*"
readr = "*"
rlang = "*"
scales = "*"
stringr = "*"
tibble = "*"
tidyr = "*"

[dependency-groups.dev]
covr = "*"
plotly = "*"
rmarkdown = "*"
testthat = ">= 3.0.0"

[config.testthat]
edition = 3

[config.roxygen2]
version = "8.1.1"

[description]
Author = "Brady Johnston"
Encoding = "UTF-8"
RoxygenNote = "7.3.2"
