[project]
name = "chromr"
version = "0.3.0"
type = "package"
title = "Read and Plot FPLC Chromatograms"
description = '''
For reading files from BioRad QuadTec machines and making
plots of the chromatograms.'''
license = "MIT + file LICENSE"

[[project.authors]]
name = "Brady Johnston"
email = "brady.johnston@me.com"
roles = [
    "aut",
    "cre",
]
orcid = "0000-0001-6301-2269"

[project.urls]
bugreports = "https://github.com/BradyAJohnston/chromr/issues"
homepage = "https://github.com/BradyAJohnston/chromr"

[dependencies]
R = ">= 4.1.0"
dplyr = "*"
ggplot2 = ">= 3.4.0"
glue = "*"
janitor = "*"
lifecycle = "*"
purrr = "*"
readr = "*"
rlang = ">= 1.1.0"
scales = "*"
stringr = "*"
tibble = "*"
tidyr = "*"
cli = "*"
pillar = "*"
vctrs = "*"

[dependency-groups.dev]
covr = "*"
plotly = "*"
rmarkdown = "*"
testthat = ">= 3.0.0"
wellr = { version = ">= 0.4.0", git = "https://github.com/BradyAJohnston/wellr.git", ref = "BradyAJohnston/wellr" }
withr = "*"

[config.testthat]
edition = 3

[config.roxygen2]
version = "8.1.1"

[description]
Language = "en-GB"
Roxygen = "list(markdown = TRUE)"
Encoding = "UTF-8"

[dependency-groups.website]
quarto = "*"
